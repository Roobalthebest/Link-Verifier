<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérificateur de Liens Sécurisés</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="container">
        <h1>Vérificateur de Sécurité de Lien</h1>
        <p>Entrez l'URL à vérifier ci-dessous :</p>
        
        <div class="input-group">
            <input type="text" id="link-input" placeholder="Ex: https://www.google.com">
            <button id="verify-button">Vérifier</button>
        </div>

        <div id="result" class="message">
            Saisissez un lien et cliquez sur 'Vérifier'.
        </div>
    </div>
    
    <script src="script.js"></script> </body>
</html>
